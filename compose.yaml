services:
  llm-proxy-api:
    image: ${LLM_PROXY_IMAGE:-su3h7am/llm-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llm-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${LLM_PROXY_CONFIG_PATH:-./config.yaml}:/LLMProxyAPI/config.yaml
      - ${LLM_PROXY_AUTH_PATH:-./auths}:/home/llmproxy/.local/share/llm-proxy-api
      - ${LLM_PROXY_LOG_PATH:-./logs}:/LLMProxyAPI/logs
      - ${LLM_PROXY_PLUGIN_PATH:-./plugins}:/LLMProxyAPI/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8317/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
