services:
  llm-proxy-api:
    image: ${LLM_PROXY_IMAGE:-su3h7am/llm-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llm-proxy-api-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${LLM_PROXY_HOME_PATH:-./home}:/home/llmproxy/.local/share/llm-proxy-api
      - ${LLM_PROXY_LOG_PATH:-./logs}:/LLMProxyAPI/logs
      - ${LLM_PROXY_PLUGIN_PATH:-./plugins}:/LLMProxyAPI/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./llmproxy -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8317/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
